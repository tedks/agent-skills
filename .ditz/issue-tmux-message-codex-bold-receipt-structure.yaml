- time: 2026-10-30T16:36:15-00:00
  who: Ted Smith
  what: commented
  comment: 'CTO R3 ruling 2026-10-30 for PR #13: a bold Codex prompt, blank separator,
    and indented following row is ambiguous between archived unsent input and genuine
    submitted row. It must not be counted as a receipt, regardless of footer wording;
    a genuine send may return receipt-timeout with status ambiguous. This issue remains
    open to replace synthetic receipt assumptions with read-only, scrubbed captures
    of actual Codex submitted rows and safely narrow the exclusion if measured evidence
    permits. Do not weaken fail-closed behavior from inference alone.'
