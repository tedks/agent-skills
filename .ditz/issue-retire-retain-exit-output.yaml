id: retire-retain-exit-output
title: Preserve exit-notice visibility before guarded tmux retirement
desc: 'During an authorized retirement batch, eight dedicated Codex CLI lanes wrote
  agent-authored private shards, passed guarded publication/identity checks, received
  one typed exit with Enter, and their pinned wrapper/native actors ended. Their tmux
  panes disappeared immediately on process exit, so the sender returned tmux-operation-failed
  and the retirement observer could not capture the required fresh same-session native
  resume notice. Private handoffs remain verified; formal receipts correctly remain
  pending-exit, not retired. A ninth lane whose exact pane had remain-on-exit enabled
  before exit completed both independent receipts and retired successfully. No process
  was killed or notice synthesized.


  Repair scope: establish durable, narrowly target-owned exit-output observation before
  submitting exit, or fail before irreversible input if evidence cannot be captured;
  preserve human composer protections, native session/PID/boot bindings and strict
  no-blind-retry semantics. Do not weaken process-plus-native-notice retirement proof
  or globally mutate unrelated tmux settings. Preserve old pending receipts honestly;
  vanished historical terminal output cannot be invented. Add paired behavior/mutation
  tests for a dedicated CLI pane that auto-closes, supported retained-pane output,
  missing/wrong native UUID, and original-process identity reuse. No current product
  lane or deployment needs resumption for this bookkeeping defect. The detailed batch
  evidence remains private; no session identifiers, process lists or private handoffs
  belong in a public issue.'
type: bugfix
