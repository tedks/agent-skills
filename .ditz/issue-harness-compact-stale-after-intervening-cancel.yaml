  what: commented
  comment: 'Seen 2026-10-16 ~12:50 ET on the search-guard lead (Claude Opus, pane
    %716, session 0b219048): operation eedb26298af447f9ab54b4de8850f8a6 under ~/.local/state/harness-control/db787646.../:
    state warning_dispatching, reason intervening_turn, watcher null, delivery/continuation
    not_dispatched. The intervening turn was a cross-session message from the CTO.
    Expected per the ruling: cancelled + one notice + a fresh request allowed. Fix:
    a cancelled operation must reach a terminal state (cancelled) that frees the session
    for a new request; cancel_operation must be allowed for a watching/warning operation
    that has not dispatched; add a fixture from this record and a regression test.
    The CTO compacted the lane by hand.'
