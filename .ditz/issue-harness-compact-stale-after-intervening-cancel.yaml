id: harness-compact-stale-after-intervening-cancel
title: 'harness-control: after an intervening-turn cancel the compact operation stays
  registered (state warning_dispatching / watching_other); cancel_operation refuses
  (cancellation_only_before_dispatch) and every new self_compact is refused as operation_in_progress'
