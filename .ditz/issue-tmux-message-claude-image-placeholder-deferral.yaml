id: tmux-message-claude-image-placeholder-deferral
title: Defer Claude composer image placeholders as opaque existing input
desc: 'Dotfiles CTO ruling in `control-delivery-image-placeholder-policy` (2026-10-29):
  fail closed. A Claude composer holding `[Image #N]` is opaque existing input; tmux-message
  must defer with its own reason and must never co-submit it with outgoing text. Add
  a scrubbed/synthetic fixture and a mutation test that proves the guard, run local
  gates and Lead council, land as a separate PR after M3 cursor fix. No real native
  image measurement was available in the ruling, so label the fixture SYNTHETIC and
  state that limit.'
