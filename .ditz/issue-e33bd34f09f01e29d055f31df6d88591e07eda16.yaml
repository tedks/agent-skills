title: Make self_compact dispatch after native idle and report failure
desc: 'Lead: Codex, pane %711, agent-skills/harness-compact-dispatch, branch fix/harness-compact-dispatch.
  Parent brief: 20261016/harness-compact-dispatch.md. Context: agent-skills master
  6607030; live installed wrapper points to Nix store; tripwire lead owns get_usage;
  this lane owns harness-control compact dispatch only.

  Assumptions: the recorded identity and native transcript remain valid while waiting;
  the caller ends its turn after self_compact. Unknown transcript or pane evidence
  must fail closed. Same-user human input may race screen polling.

  Acceptance: two incident records reproduced as fixtures; disposable Claude and Codex
  panes confirm idle -> typed /compact (Claude), compaction witness -> continuation;
  60 minute default idle bound re-arms after focus; deferred/bound expiry sends a
  single explicit pane warning; tool result says scheduled with watcher PID and bound;
  operation records each state transition. Mutation checks reject missing idle and
  bound guards. No live affected panes or state touched.

  Repair authority: modify agent-skills harness-control code/docs/tests and disposable
  test panes; local gates, PR and council to fixpoint. Stop: changed contract requiring
  product ruling, live pane/state risk, or evidence insufficiency. No open product
  ruling at claim.

  Initial evidence: b353c001 and 17f313 records both deferred at ~155 s with native_idle_not_observed_with_sender_budget;
  no delivery or continuation. SEND_BUDGET=100, PREFLIGHT=15, COMPACT_WATCH=30 reserves
  145 s out of 300 s before idle wait ends. This is a timing design flaw even if idle
  parser is correct.'
type: bugfix
