id: claude-send-shell-gate-load-flake
title: Legacy fake-tmux shell gate flakes under host load
desc: 'During agent-skills PR #16 on 2026-10-30, skills/spawn-agent/scripts/test-claude-send.sh
  passed once on commit 54daaaa (the legacy shell implementation and helper were unchanged
  through final d765ea6). Repeated exact-final-SHA reruns under framework0 load average
  23-75 on 32 CPUs failed in different fake-tmux cases, including command clear and
  trust modal, with 1-3 second wall-clock readiness budgets. A global FAKE_VIRTUAL_CLOCK=1
  rerun advanced past those but failed a later slow-second-empty test that expects
  a different clock mode. Investigate test clock isolation and eliminate wall-time
  sensitivity without weakening safety assertions. PR #16''s changed Python sender
  passed 138 unit tests, alias, config, py_compile, and private real-tmux test on
  final SHA. This flaky legacy suite is not a claim of a Python sender failure.'
