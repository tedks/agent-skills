id: compact-unconfirmed-review-notice
title: Decide review notice after delivered but unconfirmed compaction
desc: 'Context: PR #7 sends one explicit COMPACTION NOT DISPATCHED notice only when
  /compact definitely was not sent. If it was delivered but native compaction and
  pane marker cannot be confirmed, the operation record becomes timed_out or continuation_failed
  without a visible lane notice. This may be a silent stalled lane, but a notice must
  never falsely say the command was not dispatched.

  Options: (A) Send a distinct one-time review notice saying compaction was delivered
  but not confirmed, with the checkpoint path and no instruction to rerun /compact.
  (B) Record the ambiguous outcome only; rely on an operator reading the operation
  record.

  Recommendation: A, with exact wording and one-send guard reviewed before implementation.

  Decision owner: Ted. Blocks: product contract and merge of agent-skills PR #7. No
  live affected pane may be used to test the ruling.'
